services:
  postgres:
    # pgvector-enabled Postgres 16 (required for AI-2 Medical RAG).
    # Stock postgres:16-alpine does NOT include the vector extension.
    image: pgvector/pgvector:pg16
    container_name: medstudy-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: medstudy
      POSTGRES_PASSWORD: medstudy
      POSTGRES_DB: medstudy
    volumes:
      - medstudy_pg_data:/var/lib/postgresql/data

volumes:
  medstudy_pg_data:
