<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedStudy - Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
            overflow-x: hidden;
        }
        
        .bg-blob {
            position: absolute;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.5;
            animation: float 10s infinite ease-in-out alternate;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            top: -100px;
            left: -100px;
            border-radius: 50%;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            bottom: -150px;
            right: -100px;
            border-radius: 50%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }
        
        .btn-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-hover:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="min-h-screen relative flex items-center justify-center p-6">
    <!-- Animated Background Blobs -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <main class="glass-card w-full max-w-4xl p-8 md:p-12 text-center relative z-10 overflow-hidden shadow-2xl">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-teal-400"></div>
        
        <div class="mb-10">
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-4 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                MedStudy
            </h1>
            <p class="text-xl md:text-2xl text-slate-300 font-light max-w-2xl mx-auto">
                Your ultimate medical examination preparation platform. Download the app to get started.
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-12">
            <!-- Windows Download -->
            <a href="MedStudy_Windows.zip" class="btn-hover glass-card p-8 flex flex-col items-center justify-center group cursor-pointer bg-blue-900/20 hover:bg-blue-800/40 border border-blue-500/20">
                <svg class="w-16 h-16 text-blue-400 mb-4 group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 24 24"><path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-12.951-1.801"/></svg>
                <h3 class="text-2xl font-semibold mb-2">Windows</h3>
                <p class="text-sm text-slate-400 mb-4">Windows 10 & 11 (64-bit)</p>
                <span class="px-6 py-2 rounded-full bg-blue-500 text-white font-medium shadow-lg shadow-blue-500/30">Download .exe</span>
            </a>

            <!-- Android Download -->
            <a href="MedStudy_Android.apk" class="btn-hover glass-card p-8 flex flex-col items-center justify-center group cursor-pointer bg-green-900/20 hover:bg-green-800/40 border border-green-500/20">
                <svg class="w-16 h-16 text-green-400 mb-4 group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 24 24"><path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4483-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993.0001.5511-.4482.9997-.9993.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993 0 .5511-.4482.9997-.9993.9997m11.4045-6.02l1.9973-3.4592a.416.416 0 00-.1521-.5676.416.416 0 00-.5676.1521l-2.0223 3.503C15.5902 8.2428 13.8533 7.8546 12 7.8546c-1.8533 0-3.5902.3882-5.1367 1.0963L4.841 5.4477a.416.416 0 00-.5676-.1521.416.416 0 00-.1521.5676l1.9973 3.4592C2.6889 11.1867.3432 14.6589 0 18.761h24c-.3435-4.1021-2.6892-7.5743-6.1185-9.4396"/></svg>
                <h3 class="text-2xl font-semibold mb-2">Android</h3>
                <p class="text-sm text-slate-400 mb-4">Android 8.0 or newer</p>
                <span class="px-6 py-2 rounded-full bg-green-500 text-white font-medium shadow-lg shadow-green-500/30">Download .apk</span>
            </a>

            <!-- macOS Download -->
            <a href="MedStudy_macOS.zip" class="btn-hover glass-card p-8 flex flex-col items-center justify-center group cursor-pointer bg-white/10 hover:bg-white/20 border border-white/20">
                <svg class="w-16 h-16 text-white mb-4 group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                <h3 class="text-2xl font-semibold mb-2 text-white">macOS</h3>
                <p class="text-sm text-slate-300 mb-4">macOS 10.14 or newer</p>
                <span class="px-6 py-2 rounded-full bg-slate-100 text-slate-900 font-medium shadow-lg shadow-white/10">Download .zip</span>
            </a>
        </div>
        
        <div class="mt-12 text-slate-500 text-sm">
            <p>&copy; 2026 MedStudy Platform. All rights reserved.</p>
        </div>
    </main>
</body>
</html>
