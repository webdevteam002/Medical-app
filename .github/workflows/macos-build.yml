name: macOS Build

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build macOS app
        working-directory: ./mobile
        run: flutter build macos --release --dart-define=API_BASE_URL=http://92.5.56.120:3000/v1

      - name: Archive macOS app
        working-directory: ./mobile/build/macos/Build/Products/Release
        run: zip -r MedStudy_macOS.zip MedStudy.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedStudy_macOS
          path: ./mobile/build/macos/Build/Products/Release/MedStudy_macOS.zip
